
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Cutie Shop 💜</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:25px 15px;min-height:100vh;
  font-family:"Trebuchet MS",sans-serif;color:#39345f;
  background:linear-gradient(135deg,#dff4ff,#e9e0ff,#f5eaff);
  text-align:center
}
header{padding:20px 0}
h1{font-size:clamp(2rem,7vw,3.5rem);margin:15px 0}
h1 span{color:#8267dc}
.sub{color:#77729a;line-height:1.6}
.tag{
  background:white;padding:9px 16px;border-radius:30px;
  color:#7963c6;font-weight:bold
}
.shop{
  max-width:850px;margin:15px auto;padding:25px;
  background:#ffffffbd;border:1px solid white;
  border-radius:28px;box-shadow:0 12px 35px #8574c522
}
.grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:13px;margin-top:22px
}
.item{
  position:relative;border:2px solid #e5e0ff;border-radius:20px;
  background:linear-gradient(150deg,#fff,#f3f5ff);
  padding:22px 10px;cursor:pointer;color:#39345f;
  font:inherit;transition:.2s
}
.item:hover{transform:translateY(-5px);border-color:#9d88ed}
.emoji{display:block;font-size:2.5rem;margin-bottom:10px}
.item strong{display:block}
.item small{display:block;margin-top:7px;color:#827ba3}
.rare{
  position:absolute;right:7px;top:7px;background:#e9dfff;
  color:#7658c8;padding:5px 7px;border-radius:20px;
  font-size:10px;font-weight:bold
}
footer{margin:22px;color:#8b85aa;font-size:13px}
.overlay{
  display:none;position:fixed;inset:0;z-index:5;
  background:#30295766;backdrop-filter:blur(6px);
  padding:15px;align-items:center;justify-content:center
}
.overlay.show{display:flex}
.modal{
  position:relative;background:linear-gradient(145deg,#fff,#f0f4ff);
  width:min(100%,430px);max-height:90vh;overflow:auto;
  padding:28px 22px 22px;border-radius:27px;
  box-shadow:0 20px 60px #28204c55;
  animation:drop .4s ease both
}
@keyframes drop{
  from{opacity:0;transform:translateY(-70px) scale(.94)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.close{
  position:absolute;right:12px;top:10px;border:0;
  border-radius:50%;background:#ece7ff;color:#6c59b8;
  font-size:20px;width:32px;height:32px;cursor:pointer
}
.big{font-size:3rem;margin:5px}
.modal h2{font-size:1.5rem}
.modal p{color:#777194;line-height:1.6}
.counter{color:#8b76d5;font-size:12px;font-weight:bold}
button.action{
  border:0;border-radius:13px;padding:12px 16px;
  margin:5px;background:linear-gradient(100deg,#acdfff,#cbbaff);
  color:#37315f;font-weight:bold;font-size:14px;cursor:pointer
}
button.back{background:#f0edff}
.tracking{
  text-align:left;background:#f6f4ff;border:1px solid #e7e0ff;
  padding:14px;border-radius:16px;margin:15px 0
}
.tracking p{margin:8px 0;font-size:14px}
.date{font-size:1.4rem;font-weight:bold;color:#8267dc}
.tiny{font-size:11px!important;color:#9991b2!important}
@media(max-width:450px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .item:last-child{grid-column:1/-1}
  .shop{padding:17px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header>
  <span class="tag">✦ THE CUTIE SHOP ✦</span>
  <h1>What would you like<br>to <span>order?</span> 🛍️</h1>
  <p class="sub">Five choices. Choose wisely.<br>Your cart, your choices, your consequences. 💜</p>
</header>

<main class="shop">
  <h2>Today's little wishlist 💭</h2>
  <div class="grid">
    <button class="item" onclick="regular('iphone')">
      <span class="emoji">📱</span><strong>iPhone 18 Pro</strong>
      <small>For the aesthetic ✨</small>
    </button>
    <button class="item" onclick="regular('ps5')">
      <span class="emoji">🎮</span><strong>PS5</strong>
      <small>Just one more game</small>
    </button>
    <button class="item" onclick="regular('food')">
      <span class="emoji">🍗</span><strong>Al Faham</strong>
      <small>A delicious decision</small>
    </button>
    <button class="item" onclick="startRiya()">
      <span class="rare">ONLY 1 AVAILABLE</span>
      <span class="emoji">🎀</span><strong>Riya</strong>
      <small>Rare item · Limited edition</small>
    </button>
    <button class="item" onclick="regular('hotwheels')">
      <span class="emoji">🏎️</span><strong>Hot Wheels</strong>
      <small>Big dreams, tiny car</small>
    </button>
  </div>
  <p class="sub">♡ No actual money is being spent. Your dignity, however, is at risk. ♡</p>
</main>
<footer>Made with sparkles, chaos and lots of 💜</footer>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <button class="close" onclick="closePopup()" aria-label="Close">×</button>
    <div class="counter" id="counter"></div>
    <div class="big" id="emoji">💜</div>
    <h2 id="title"></h2>
    <p id="message"></p>
    <div id="extra"></div>
    <button class="action" id="next" onclick="nextStep()">Okay! 💜</button>
    <button class="action back" onclick="closePopup()">Back to shop</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let step = 0;

function popup(emoji,title,message,button="Okay! 💜",extra=""){
  $("emoji").textContent=emoji;
  $("title").textContent=title;
  $("message").textContent=message;
  $("counter").textContent="";
  $("extra").innerHTML=extra;
  $("next").textContent=button;
  $("next").onclick=closePopup;
  $("overlay").classList.add("show");
  document.body.style.overflow="hidden";
  const modal=document.querySelector(".modal");
  modal.style.animation="none";
  void modal.offsetWidth;
  modal.style.animation="";
}
function regular(which){
  const data={
    iphone:["📱","A little phone-shaped temptation","An iPhone 18 Pro? Your camera roll is about to live a luxury lifestyle. Your wallet may need a minute.","Worth a thought ✨"],
    ps5:["🎮","Game time!","A PS5 has entered the chat. Productivity has politely left the building. Enjoy your gaming era!","Level up 💫"],
    food:["🍗","Excellent taste detected","Al Faham! A delicious choice. Please allow 3–5 business minutes for your stomach to celebrate.","Yum, confirmed 😋"],
    hotwheels:["🏎️","Tiny car, giant dreams","A Hot Wheels! Affordable luxury, easy parking, and no fuel expenses. Iconic, honestly.","Vroom vroom 🏁"]
  }[which];
  popup(data[0],data[1],data[2],data[3]);
}
const riya=[
  ["🎀","Ooh, interesting choice!","You've selected Riya. Please wait while we check the availability of this very special item.","Check availability →"],
  ["🔍","Checking the inventory…","Searching… searching… Oh! We have some news. There is only ONE available.","Only one? 👀"],
  ["💎","RARE ITEM UNLOCKED","Congratulations! Riya is a one-of-one limited edition. No duplicates, no restock, and absolutely no replacement.","Proceed with order →"],
  ["📦","Your order has been dispatched!","The order is confirmed and has been dispatched. Please check the delivery details below.","Track my order 🚚"],
  ["💌","A little note for you","Thank you for placing this very questionable but excellent order. Please read the cute terms before celebrating.","Read the cute terms ♡"],
  ["🩵","Order details confirmed!","Your order summary is ready. Screenshot this very official (not official at all) confirmation!","Finish ✨"]
];

function startRiya(){step=0;showRiya()}
function showRiya(){
  const [emoji,title,message,button]=riya[step];
  let extra="";
  if(step===3){
    extra=`<div class="tracking">
      <b>EXPECTED DELIVERY DATE</b>
      <div class="date">November 14, 2026</div>
      <p>✓ Order confirmed</p><p>✓ Dispatched successfully</p>
      <p>♡ Delivery date: November 14</p>
    </div><p class="tiny">Tracking status: logistically mysterious.</p>`;
  }
if(step===4){
  extra=`<div class="tracking">
    <p>♡ <b>Term 1:</b> Only one rare item is available.</p>
    <p>♡ <b>Term 2:</b> No returns, exchanges, or “I changed my mind.”</p>
    <p>♡ <b>Term 3:</b> Handle with care; occasional drama may occur.</p>
    <p>♡ <b>Term 4:</b> The shop is not responsible for unexpected giggles.</p>
    <p>♡ <b>Term 5:</b> Good food dates are mandatory. No negotiations.</p>
    <p>♡ <b>Term 6:</b> Outings and spontaneous little adventures are required.</p>
    <p>♡ <b>Term 7:</b> Private concerts included.</p>
    <p>♡ <b>Term 8:</b> Unlimited conversations, random thoughts, and late-night talks.</p>
    <p>♡ <b>Term 9:</b> Extra affection, silly moments, and quality time must be provided.</p>
    <p>♡ <b>Term 10:</b> Must tolerate clinginess, and occasional overthinking.</p>
  </div>`;
  }
  if(step===5){
    extra=`<div class="tracking">
      <p><b>ITEM:</b> Riya — Limited Edition 🎀</p>
      <p><b>AVAILABILITY:</b> 1 only</p>
      <p><b>STATUS:</b> Dispatched 📦</p>
      <p><b>EXPECTED DELIVERY:</b> November 14, 2026</p>
    </div><p class="tiny">No real purchase or shipment has been made. Just a cute surprise!</p>`;
  }
  popup(emoji,title,message,button,extra);
  $("counter").textContent=`RIYA ORDER · POPUP ${step+1} OF ${riya.length}`;
  $("next").onclick=()=>{
    if(step<riya.length-1){step++;showRiya()}
    else closePopup();
  };
}
function closePopup(){
  $("overlay").classList.remove("show");
  document.body.style.overflow="";
}
$("overlay").addEventListener("click",e=>{
  if(e.target===$("overlay"))closePopup();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closePopup();
});
</script>
</body>
</html>
